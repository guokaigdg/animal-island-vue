<svg width="49" height="48" viewBox="0 0 49 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Original hand-drawn pointing cursor: cream hand, brown outline, mint cuff -->
    <g transform="translate(4 1) rotate(-40)">
        <!-- sleeve cuff (drawn first, sits behind the hand) -->
        <rect x="-13" y="33" width="28" height="13" rx="4" fill="#7FD6C9" stroke="#5A4632" stroke-width="3" />
        <path d="M -8 39.5 h 2.5 M -2 39.5 h 2.5 M 4 39.5 h 2.5" stroke="#FFF9EA" stroke-width="2" stroke-linecap="round" />
        <!-- hand: index finger up, thumb bump left, webbing flare right -->
        <path
            d="M 0 0
            C 2.8 0 5 2.6 5 5.8
            L 5 15
            C 5 16 5.6 16.5 6.8 16.8
            C 10 17.8 11.5 20 11.5 23
            L 11.5 30
            C 11.5 33.4 8.8 35 5.5 35
            L -5.5 35
            C -8.8 35 -11.5 33.4 -11.5 30
            L -11.5 27.5
            C -15.5 26 -15.5 20.5 -11.5 19
            C -11.5 18 -10 17.3 -7.8 16.7
            C -6 16.2 -5 15.4 -5 14
            L -5 5.8
            C -5 2.6 -2.8 0 0 0
            Z"
            fill="#FFF9EA"
            stroke="#5A4632"
            stroke-width="3"
            stroke-linejoin="round"
        />
        <!-- thumb crease -->
        <path d="M -9.5 24.5 q 2 1.8 4.4 1.4" stroke="#5A4632" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.55" />
        <!-- knuckle crease -->
        <path d="M 7 20.5 q 1.8 2 1.5 4.4" stroke="#5A4632" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.55" />
    </g>
</svg>
